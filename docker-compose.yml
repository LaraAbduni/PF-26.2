name: pf-avaliacoes
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-avaliacoes}
      POSTGRES_USER: ${DATABASE_USERNAME:-avaliacoes}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-avaliacoes}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-avaliacoes}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no .env}
      AUTH0_ISSUER: ${AUTH0_ISSUER:?Defina AUTH0_ISSUER no .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Defina AUTH0_AUDIENCE no .env}
      AUTH0_CLAIM_NAMESPACE: ${AUTH0_CLAIM_NAMESPACE:-https://pf-avaliacoes.example.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8084}:8080"
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  dados:
