# Perfil para executar a PF no computador, sem instalar Docker/PostgreSQL.
# O arquivo do banco fica em PF-26.2/data; a autenticação continua sendo Auth0.
server.address=127.0.0.1
server.port=${SERVER_PORT:8084}
spring.datasource.url=jdbc:h2:file:./data/avaliacoes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:https://dev-k7tg61f5uq4tz4ja.us.auth0.com/}
auth0.audience=${AUTH0_AUDIENCE:https://api.pf-avaliacoes}
auth0.claim-namespace=${AUTH0_CLAIM_NAMESPACE:https://pf-avaliacoes.example.com}
frontend.url=http://localhost:5173
