spring.application.name=avaliacoes
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/avaliacoes}
spring.datasource.username=${DATABASE_USERNAME:avaliacoes}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER}
auth0.audience=${AUTH0_AUDIENCE}
auth0.claim-namespace=${AUTH0_CLAIM_NAMESPACE:https://pf-avaliacoes.example.com}
frontend.url=${FRONTEND_URL:http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never
