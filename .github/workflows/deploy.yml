name: Testar e publicar API de avaliações

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pf-back-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: mvn -B verify
      - run: sh -n deployment/deploy.sh

  deploy:
    # A PF esta sendo executada localmente. Deploy remoto somente se iniciado manualmente.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'larinhazzz' }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir configuração antes de publicar
        env:
          HOST_TEST: ${{ secrets.HOST_TEST }}
          KEY_TEST: ${{ secrets.KEY_TEST }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          AUTH0_ISSUER: ${{ vars.AUTH0_ISSUER }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          for name in HOST_TEST KEY_TEST DOCKERHUB_TOKEN DATABASE_PASSWORD AUTH0_ISSUER AUTH0_AUDIENCE FRONTEND_URL; do
            if [ -z "${!name}" ]; then echo "::error::Configure $name em Settings > Secrets and variables > Actions"; exit 1; fi
          done
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/pf-avaliacoes-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Enviar script para a AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          source: deployment/deploy.sh
          target: /home/ubuntu/pf-avaliacoes
          strip_components: 1
      - name: Deploy na mesma EC2 do Crescit
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ env.DOCKERHUB_USERNAME }}/pf-avaliacoes-ci:${{ github.sha }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          AUTH0_ISSUER: ${{ vars.AUTH0_ISSUER }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          AUTH0_CLAIM_NAMESPACE: ${{ vars.AUTH0_CLAIM_NAMESPACE || 'https://pf-avaliacoes.example.com' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          command_timeout: 10m
          envs: IMAGE_TAG,DATABASE_PASSWORD,AUTH0_ISSUER,AUTH0_AUDIENCE,AUTH0_CLAIM_NAMESPACE,FRONTEND_URL
          script: sh /home/ubuntu/pf-avaliacoes/deploy.sh
